<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2042" />
      <stop offset="100%" stop-color="#070d1e" />
    </linearGradient>
    <linearGradient id="goldCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle/Rounded rect with navy blue theme -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="220" r="180" fill="url(#glow)" />
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Holy Rays -->
  <g stroke="#FCD34D" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="50" x2="256" y2="70"/>
    <line x1="256" y1="390" x2="256" y2="410"/>
    <line x1="100" y1="210" x2="120" y2="210"/>
    <line x1="392" y1="210" x2="412" y2="210"/>
    <line x1="145" y1="99" x2="160" y2="114"/>
    <line x1="367" y1="99" x2="352" y2="114"/>
    <line x1="145" y1="321" x2="160" y2="306"/>
    <line x1="367" y1="321" x2="352" y2="306"/>
  </g>

  <!-- Golden Holy Cross (Thánh Giá) -->
  <!-- Vertical Beam -->
  <rect x="226" y="80" width="60" height="340" rx="10" fill="url(#goldCross)" filter="url(#shadow)" />
  <!-- Horizontal Beam -->
  <rect x="136" y="180" width="240" height="60" rx="10" fill="url(#goldCross)" filter="url(#shadow)" />

  <!-- Center Highlight Accent -->
  <circle cx="256" cy="210" r="16" fill="#FFFBEB" opacity="0.9"/>
  <circle cx="256" cy="210" r="28" fill="none" stroke="#FCD34D" stroke-width="3" opacity="0.8"/>
</svg>
